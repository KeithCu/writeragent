name: Compute image

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image version
        id: ver
        run: |
          ver=$(python -c 'import re; t=open("plugin/version.py").read(); print(re.search(r"EXTENSION_VERSION = \"([^\"]+)\"", t).group(1))')
          echo "version=$ver" >> "$GITHUB_OUTPUT"
      - name: Build
        run: |
          IMAGE="ghcr.io/keithcu/writeragent-compute"
          VER="${{ steps.ver.outputs.version }}"
          docker build -f compute_service/Dockerfile \
            --label "org.opencontainers.image.source=https://github.com/KeithCu/writeragent" \
            -t "python-compute:${VER}" \
            -t "${IMAGE}:${VER}" \
            -t "${IMAGE}:latest" .
          if [ "${{ github.event_name }}" = "release" ]; then
            tag="${GITHUB_REF_NAME#v}"
            docker tag "python-compute:${VER}" "python-compute:${tag}"
            docker tag "python-compute:${VER}" "${IMAGE}:${tag}"
          fi
      - name: Push to GHCR
        run: |
          IMAGE="ghcr.io/keithcu/writeragent-compute"
          docker push "${IMAGE}:${{ steps.ver.outputs.version }}"
          docker push "${IMAGE}:latest"
          if [ "${{ github.event_name }}" = "release" ]; then
            tag="${GITHUB_REF_NAME#v}"
            docker push "${IMAGE}:${tag}"
          fi
