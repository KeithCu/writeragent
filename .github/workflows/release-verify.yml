name: Release Verify

on:
  workflow_dispatch:
    inputs:
      os:
        description: "Operating system runner"
        required: true
        default: "ubuntu-latest"
        type: choice
        options:
          - "ubuntu-latest"
          - "macos-latest"
          - "windows-latest"
          - "all"

jobs:
  release-verify:
    name: ${{ format('Release Verify ({0})', matrix.os) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 50 || 40 }}
    strategy:
      fail-fast: false
      matrix:
        os: >-
          ${{
            inputs.os == 'all' && fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]') ||
            fromJSON(format('["{0}"]', inputs.os || 'ubuntu-latest'))
          }}

    defaults:
      run:
        shell: bash

    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install LibreOffice and system tools (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
                     /etc/apt/sources.list.d/google-chrome.sources \
                     /etc/apt/sources.list.d/google.list
          sudo add-apt-repository -y ppa:libreoffice/ppa
          sudo apt-get update
          sudo apt-get install -y libreoffice libreoffice-dev python3-uno gettext

      - name: Install LibreOffice and system tools (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install --cask libreoffice || true
          brew install gettext || true
          echo "/Applications/LibreOffice.app/Contents/MacOS" >> $GITHUB_PATH
          echo "/opt/homebrew/opt/gettext/bin" >> $GITHUB_PATH
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          APP="/Applications/LibreOffice.app"
          if [ -d "$APP" ]; then
            echo "=== LibreOffice macOS Python layout ==="
            "$APP/Contents/MacOS/soffice" --version || true
            ls -l "$APP/Contents/Resources/python" \
              "$APP/Contents/Resources/officehelper.py" \
              "$APP/Contents/Resources/uno.py" 2>&1 || true
            find "$APP/Contents" \( -name officehelper.py -o -name uno.py -o -name pyuno.so \) 2>/dev/null | head -20 || true
            if [ -x "$APP/Contents/Resources/python" ]; then
              "$APP/Contents/Resources/python" -c \
                "import officehelper, uno; print('wrapper officehelper', officehelper.__file__); print('wrapper uno', uno.__file__)" \
                || echo "Resources/python wrapper could not import officehelper/uno"
            else
              echo "Contents/Resources/python wrapper missing"
            fi
          else
            echo "LibreOffice.app not found under /Applications"
          fi

      - name: Install LibreOffice and system tools (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install libreoffice-fresh gettext make -y || true
          bash scripts/ci_windows_tools_fallback.sh
          echo "C:\\Program Files\\LibreOffice\\program" >> $GITHUB_PATH
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: |
          uv sync --frozen --dev

      # Windows: keep a minidump if soffice.bin crashes during the UNO stage.
      - name: Enable soffice crash dumps (Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\soffice.bin'
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpFolder -PropertyType ExpandString -Value "$env:RUNNER_TEMP\dumps" -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpType -PropertyType DWord -Value 1 -Force | Out-Null

      - name: Run release verification
        run: |
          export MPLCONFIGDIR="${RUNNER_TEMP}/matplotlib"
          export MPLBACKEND=Agg
          mkdir -p "$MPLCONFIGDIR"
          if [ -x .venv/bin/python ]; then
            PY=.venv/bin/python
          else
            PY=.venv/Scripts/python.exe
          fi
          "$PY" -c "import matplotlib; matplotlib.use('Agg'); import matplotlib.pyplot"
          make release-verify

      - name: Show soffice crash dumps (Windows)
        if: ${{ failure() && runner.os == 'Windows' }}
        shell: pwsh
        run: |
          # LibreOffice's own signal handler can end the process before WER writes
          # a dump, but Application Error / WER events still name the fault.
          Get-WinEvent -FilterHashtable @{ LogName = 'Application'; StartTime = (Get-Date).AddHours(-2) } -ErrorAction SilentlyContinue |
            Where-Object { $_.ProviderName -in @('Application Error', 'Windows Error Reporting', 'Application Hang') } |
            Format-List TimeCreated, ProviderName, Id, Message
          $dumps = Get-ChildItem "$env:RUNNER_TEMP\dumps" -Filter *.dmp -ErrorAction SilentlyContinue
          if (-not $dumps) { Write-Output "no soffice.bin dumps"; exit 0 }
          $cdb = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Debuggers\x64\cdb.exe" -ErrorAction SilentlyContinue
          foreach ($d in $dumps) {
            Write-Output "=== $($d.FullName)"
            if ($cdb) { & $cdb.FullName -z $d.FullName -c ".ecxr; kn 40; q" }
          }

      - name: Upload soffice crash dumps (Windows)
        if: ${{ failure() && runner.os == 'Windows' }}
        uses: actions/upload-artifact@v7
        with:
          name: soffice-dumps-${{ github.run_id }}
          path: ${{ runner.temp }}/dumps/
          if-no-files-found: ignore

