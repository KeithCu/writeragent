name: PR CI

on:
  pull_request:
  workflow_dispatch:
    inputs:
      os:
        description: "Operating system runner"
        required: true
        default: "ubuntu-latest"
        type: choice
        options:
          - "ubuntu-latest"
          - "macos-latest"
          - "windows-latest"
          - "all"
      test_mock_sidebar:
        description: "Run make test-mock-sidebar only (skip typecheck, pytest/UNO, packaging)"
        required: false
        default: false
        type: boolean
      ci_debug:
        description: "Opt-in hang diagnostics (nodeid trail, faulthandler, --max-worker-restart=0, process dump, artifacts). Off by default."
        required: false
        default: false
        type: boolean
      pytest_serial:
        description: "Disable xdist (PYTEST_WORKERS=0). Use with ci_debug to get a serial traceback."
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ inputs.test_mock_sidebar == true && format('Mock LLM Sidebar ({0})', matrix.os) || format('Test & Typecheck ({0})', matrix.os) }}
    runs-on: ${{ matrix.os }}
    # 30 is the budget that cancelled 33447705893 after the xdist replace wedge.
    # Debug runs get 40 so dump + artifact upload still run after a 25-min test step.
    timeout-minutes: ${{ inputs.test_mock_sidebar == true && 60 || (inputs.ci_debug == true && 40 || 30) }}
    strategy:
      fail-fast: false
      matrix:
        os: >-
          ${{
            github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') ||
            (inputs.os == 'all' && fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]') ||
            fromJSON(format('["{0}"]', inputs.os || 'ubuntu-latest')))
          }}

    defaults:
      run:
        shell: bash

    # Windows runners default Python stdio to cp1252; pyspector prints U+1F4A1.
    # Do not set WRITERAGENT_CI_DEBUG_DIR here: runner is not available in
    # jobs.<job_id>.env (startup_failure 33452656845). Run steps export
    # $RUNNER_TEMP/pytest-ci-debug instead; upload-artifact path uses
    # ${{ runner.temp }} at step level, which is valid.
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      WRITERAGENT_CI_DEBUG: ${{ inputs.ci_debug == true && '1' || '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install LibreOffice and system tools (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo add-apt-repository -y ppa:libreoffice/ppa
          sudo apt-get update
          # libreoffice-dev ships unoidl-write; make build-core / rdb-core needs it.
          sudo apt-get install -y libreoffice libreoffice-dev python3-uno gettext
          # Visible Writer for make test-mock-sidebar (testing_runner requires DISPLAY).
          if [ "${{ inputs.test_mock_sidebar }}" = "true" ]; then
            sudo apt-get install -y xvfb dbus-x11
          fi
          # Fatal here (unlike macOS/Windows), so ride out transient resets from raw.githubusercontent.com.
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors \
            https://raw.githubusercontent.com/opengrep/opengrep/main/install.sh | bash
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install LibreOffice and system tools (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install --cask libreoffice || true
          brew install gettext || true
          curl -fsSL https://raw.githubusercontent.com/opengrep/opengrep/main/install.sh | bash || true
          echo "/Applications/LibreOffice.app/Contents/MacOS" >> $GITHUB_PATH
          echo "/opt/homebrew/opt/gettext/bin" >> $GITHUB_PATH
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          # officehelper.py is in Contents/Resources (not the framework python3).
          # Dump the brew-cask layout so a future UNO bootstrap miss is diagnosable.
          APP="/Applications/LibreOffice.app"
          if [ -d "$APP" ]; then
            echo "=== LibreOffice macOS Python layout ==="
            "$APP/Contents/MacOS/soffice" --version || true
            ls -l "$APP/Contents/Resources/python" \
              "$APP/Contents/Resources/officehelper.py" \
              "$APP/Contents/Resources/uno.py" 2>&1 || true
            find "$APP/Contents" \( -name officehelper.py -o -name uno.py -o -name pyuno.so \) 2>/dev/null | head -20 || true
            if [ -x "$APP/Contents/Resources/python" ]; then
              "$APP/Contents/Resources/python" -c \
                "import officehelper, uno; print('wrapper officehelper', officehelper.__file__); print('wrapper uno', uno.__file__)" \
                || echo "Resources/python wrapper could not import officehelper/uno"
            else
              echo "Contents/Resources/python wrapper missing"
            fi
          else
            echo "LibreOffice.app not found under /Applications"
          fi

      - name: Install LibreOffice and system tools (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install libreoffice-fresh gettext make -y || true
          echo "C:\\Program Files\\LibreOffice\\program" >> $GITHUB_PATH
          # typecheck runs opengrep-lint; Linux/macOS install this, Windows did not.
          powershell -NoProfile -ExecutionPolicy Bypass -Command \
            "irm https://raw.githubusercontent.com/opengrep/opengrep/main/install.ps1 | iex" || true
          echo "$USERPROFILE/.opengrep/cli/latest" >> $GITHUB_PATH
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: |
          uv sync --dev

      - name: Prepare build artifacts (manifest, vendor, translations)
        run: |
          make vendor manifest compile-translations

      - name: Run typecheck
        if: ${{ inputs.test_mock_sidebar != true }}
        run: |
          make typecheck

      - name: Build & install WriterAgent extension
        run: |
          make build
          make register-built-oxt
          # grep -q + pipefail: unopkg dies of SIGPIPE (exit 141) after the first match.
          unopkg list > "$RUNNER_TEMP/unopkg-list.txt"
          grep "org.extension.writeragent" "$RUNNER_TEMP/unopkg-list.txt"

      - name: Run tests (Pytest + UNO)
        if: ${{ inputs.test_mock_sidebar != true }}
        timeout-minutes: 25
        run: |
          if [ "${{ inputs.pytest_serial }}" = "true" ]; then
            export PYTEST_WORKERS=0
          fi
          export WRITERAGENT_CI_DEBUG_DIR="$RUNNER_TEMP/pytest-ci-debug"
          if [ "$WRITERAGENT_CI_DEBUG" = "1" ]; then
            mkdir -p "$WRITERAGENT_CI_DEBUG_DIR"
          fi
          make test

      - name: Dump leftover processes (CI debug)
        if: ${{ always() && inputs.ci_debug == true }}
        run: |
          export WRITERAGENT_CI_DEBUG_DIR="$RUNNER_TEMP/pytest-ci-debug"
          mkdir -p "$WRITERAGENT_CI_DEBUG_DIR"
          dump="$WRITERAGENT_CI_DEBUG_DIR/processes.txt"
          if [ "${{ runner.os }}" = "Windows" ]; then
            tasklist > "$dump" || true
          else
            ps -ef > "$dump" || true
          fi
          echo "=== harper-ls / soffice.bin ==="
          grep -E 'harper-ls|soffice(\.bin)?' "$dump" || echo "(none)"

      - name: Upload CI debug artifacts
        if: ${{ always() && inputs.ci_debug == true }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-debug-${{ matrix.os }}-${{ github.run_id }}
          path: ${{ runner.temp }}/pytest-ci-debug/
          if-no-files-found: warn

      - name: Verify Core & Grammar Extension Packaging Lifecycles (LibrePy, LibreHarper)
        if: ${{ inputs.test_mock_sidebar != true }}
        run: |
          # 1. Build and install LibrePy (removes WriterAgent as both share addin namespace)
          make build-core
          make register-librepy-oxt
          unopkg list > "$RUNNER_TEMP/unopkg-list.txt"
          grep "org.extension.librepy" "$RUNNER_TEMP/unopkg-list.txt"

          # 2. Build and install LibreHarper
          make build-harper
          make register-libreharper-oxt
          unopkg list > "$RUNNER_TEMP/unopkg-list.txt"
          grep "org.extension.libreharper" "$RUNNER_TEMP/unopkg-list.txt"

          # 3. Clean up installed packages
          unopkg remove org.extension.libreharper || true
          unopkg remove org.extension.librepy || true

      - name: Run mock LLM sidebar tests
        if: ${{ inputs.test_mock_sidebar == true }}
        run: |
          make ensure-uno
          if [ "${{ runner.os }}" = "Linux" ]; then
            xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
              dbus-run-session -- make test-mock-sidebar
          else
            make test-mock-sidebar
          fi
