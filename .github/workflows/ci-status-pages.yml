# Static CI status table (index.html + status.svg) for
# https://keithcu.github.io/writeragent/
# Pages Source must be GitHub Actions (Settings → Pages). First deploy
# may need approval of the github-pages environment.
name: CI Status Pages

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - PR CI
      - CrossHair Verification (Deep / On-Demand)
    types:
      - completed

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate CI status HTML and SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/generate_ci_status.py --out _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
