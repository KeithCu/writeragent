# Static CI status table (index.html + status.svg) for
# https://keithcu.github.io/writeragent/
# Pages Source must be GitHub Actions (Settings → Pages). First deploy
# may need approval of the github-pages environment.
name: CI Status Pages

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - PR CI
      - CrossHair Verification (Deep / On-Demand)
    types:
      - completed

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Restore CI status cache
        uses: actions/cache/restore@v6
        with:
          path: .cache/ci-status
          key: ci-status-${{ github.run_id }}
          restore-keys: |
            ci-status-

      - name: Generate CI status HTML, SVG, and JSON
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/generate_ci_status.py --out _site --cache .cache/ci-status/status.json

      - name: Save CI status cache
        uses: actions/cache/save@v6
        if: always()
        with:
          path: .cache/ci-status
          key: ci-status-${{ github.run_id }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
