name: agent_backend
title: Agent Communication Protocol
requires: [config, document]
config_inline: mcp

config:
  backend_id:
    type: string
    default: builtin
    widget: select
    label: Backend
    options:
      - value: builtin
        label: Built-in
      - value: hermes
        label: Hermes
      - value: claude
        label: Claude Code
      - value: vibe
        label: Mistral Vibe
      - value: grok
        label: Grok Build
      - value: opencode
        label: OpenCode

  path:
    type: string
    default: ""
    widget: text
    label: Path
    helper: "Path to the backend CLI. Empty = search PATH."
    internal: true

  args:
    type: string
    default: ""
    widget: text
    label: Extra arguments
    helper: "Optional arguments for the selected backend (space-separated)."
    internal: true

  prompt_for_permission:
    type: boolean
    default: true
    widget: checkbox
    label: Prompt for Agent Permissions
    helper: "Ask for confirmation before allowing the agent to use tools (read files, execute commands, etc.)"
