name: mcp_client
title: Integrations
requires: [config, events]

config:
  _sep_mcp_servers:
    widget: separator
    label: MCP servers for the sidebar chat
  server:
    type: string
    default: ""
    widget: combo
    label: Server
    settings_persist: false
    inline: true
    width: 150
  add_server:
    type: string
    default: ""
    widget: button
    button_text: Add
    settings_persist: false
    inline: true
    inline_no_label: true
    x: 270
    width: 55
  remove_server:
    type: string
    default: ""
    widget: button
    button_text: Remove
    settings_persist: false
    inline_no_label: true
    x: 332
    width: 65
  enabled:
    type: boolean
    default: false
    widget: checkbox
    label: Use this MCP server in chat
    helper: Sidebar chat only (mcp domain); never exposed to WriterAgent's MCP server or to scripts.
    settings_persist: false
    inline: true
    width: 168
  trusted:
    type: boolean
    default: false
    widget: checkbox
    label: Trust its read-only tools (no prompt)
    helper: Tools the server marks readOnlyHint run without Accept / Change / Reject; every other call still asks
    settings_persist: false
    x: 195
    width: 235
  name:
    type: string
    default: ""
    widget: text
    label: Name
    helper: Prefixes this server's tool names (e.g. home -> mcp__home__tool).
    settings_persist: false
    inline: true
    width: 100
  url:
    type: string
    default: ""
    widget: text
    label: Server URL
    helper: Streamable-HTTP MCP endpoint, e.g. http://localhost:8000/mcp
    settings_persist: false
    label_x: 215
    label_width: 42
    x: 260
    width: 170
  token:
    type: string
    default: ""
    widget: password
    label: Token
    helper: Bearer token. Settings OK stores it in the system keyring when one is available, otherwise in writeragent.json.
    settings_persist: false
  status:
    type: string
    default: ""
    widget: textarea
    label: Status
    readonly: true
    settings_persist: false
    width: 320
    height: 36
  servers:
    type: dict
    default: {}
    internal: true
    secret_fields: [token]
    helper: "Accepted keys per entry: url, headers, enabled, timeout, connect_timeout, tools.include, tools.exclude, trust (full/untrusted), token."
