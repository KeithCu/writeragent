name: mcp_client
title: Integrations
requires: [config, events]

config:
  _sep_mcp_servers:
    widget: separator
    label: MCP servers for the sidebar chat
  enabled:
    type: boolean
    default: false
    widget: checkbox
    label: Use this MCP server in chat
    helper: Sidebar chat only (mcp domain); never exposed to WriterAgent's MCP server or to scripts.
    inline: true
    width: 168
  trusted:
    type: boolean
    default: false
    widget: checkbox
    label: Trust its read-only tools (no prompt)
    helper: Tools the server marks readOnlyHint run without Accept / Change / Reject; every other call still asks
    x: 195
    width: 235
  name:
    type: string
    default: ""
    widget: text
    label: Name
    helper: Short label the model uses for this server, e.g. home.
    inline: true
    width: 100
  url:
    type: string
    default: ""
    widget: text
    label: Server URL
    helper: Streamable-HTTP MCP endpoint, e.g. http://localhost:8000/mcp
    label_x: 215
    label_width: 42
    x: 260
    width: 170
  token_keychain:
    type: string
    default: ""
    widget: text
    label: Keychain item (macOS)
    helper: macOS Keychain item holding the bearer token. Preferred over the token field.
    inline: true
    width: 100
  token:
    type: string
    default: ""
    widget: password
    label: Token
    helper: Bearer token saved in plain text in writeragent.json. Used only when Keychain item is empty.
    label_x: 215
    label_width: 85
    x: 302
    width: 128
  servers:
    type: dict
    default: {}
    widget: textarea
    label: "More servers (JSON object keyed by server name):"
    helper: "Accepted keys per entry: url, headers, enabled, timeout, connect_timeout, tools.include, tools.exclude, trust (full/untrusted), token, token_keychain."
    label_above: true
    label_x: 8
    label_width: 422
    x: 8
    width: 422
    height: 90
