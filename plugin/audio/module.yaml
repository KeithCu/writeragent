name: audio
title: Speech
requires: [config]

config:
  stt_model:
    type: string
    default: ""
    widget: combo
    label: "Audio Model:"
    helper: "Speech-to-text model when the chat model cannot take audio input."

  tts_enabled:
    type: boolean
    default: false
    widget: checkbox
    label: Enable Speech Output (TTS)
    helper: Speak assistant responses aloud using text-to-speech.

  tts_sentence_mode:
    type: boolean
    default: true
    widget: checkbox
    label: Speak sentence by sentence
    helper: "Synthesize the next sentences while the current one plays, so a short sentence is not followed by a gap. Stop discards clips that are not playing yet. Turn off to speak the whole reply as one clip."

  tts_provider:
    type: string
    default: system
    widget: select
    label: TTS Provider
    helper: "Choose whether to use built-in OS speech, a local neural engine, or your API endpoint."
    options:
      - value: system
        label: "OS Native (say / SAPI / spd-say)"
      - value: kokoro
        label: "Kokoro (Local Neural, ONNX CPU)"
      - value: piper
        label: "Piper (Local Fast Neural, CPU)"
      - value: endpoint
        label: "Current Chat Endpoint (/audio/speech)"

  tts_model:
    type: string
    default: ""
    widget: combo
    label: TTS Model
    helper: "Model for speech synthesis (used when TTS Provider is Current Chat Endpoint)."

  tts_voice:
    type: string
    default: "alloy"
    widget: select
    label: Voice
    helper: "Voice for the selected provider. The list matches the Piper or Kokoro catalog for your locale."
    # Runtime options come from the voice catalog (same source as the sidebar).
    # This stub is only the XDL fallback when options_provider cannot run.
    options_provider: plugin.audio.tts_service:settings_voice_options
    options:
      - value: "alloy"
        label: "alloy (OpenAI Neutral)"
      - value: "af_sky"
        label: "af_sky (Kokoro US Female - Sky)"
      - value: "en_US-lessac-medium"
        label: "en_US-lessac-medium (US English Female - Lessac)"
      - value: "default"
        label: "default (System Default)"

  # Own row under Voice, in the control column (x matches the selects).
  # Sharing the Voice row narrowed that combo. Not saved: it speaks the
  # controls currently on screen.
  test_voice:
    type: string
    default: ""
    widget: button
    label: Test voice
    inline_no_label: true
    settings_persist: false
    x: 110
    width: 88

  tts_speed:
    type: string
    default: "1.0x"
    widget: combo
    label: Speech Speed
    helper: "Playback speed multiplier (1.0x, 1.1x, 1.25x, 1.5x, 1.75x, 2.0x, or custom down to 0.25x)."
    options:
      - value: "1.0x"
        label: "1.0x"
      - value: "1.1x"
        label: "1.1x"
      - value: "1.25x"
        label: "1.25x"
      - value: "1.5x"
        label: "1.5x"
      - value: "1.75x"
        label: "1.75x"
      - value: "2.0x"
        label: "2.0x"

  tts_voice_kokoro:
    type: string
    default: "af_sky"
    internal: true

  tts_voice_piper:
    type: string
    default: "en_US-lessac-medium"
    internal: true

  tts_voice_openai:
    type: string
    default: "alloy"
    internal: true

  tts_voice_system:
    type: string
    default: "default"
    internal: true
