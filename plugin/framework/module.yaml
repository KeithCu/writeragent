name: core
title: Core services (config, events, logging)
provides_services: [document, config, events, format]
requires: []

config:
  log_level:
    type: string
    # Release default. Source checkouts with plugin/tests get DEBUG via
    # config_schema._resolve_default (and get_config_schema overlays that).
    default: WARN
    widget: select
    label: Log Level
    internal: true
    options:
      - value: DEBUG
        label: Debug
      - value: INFO
        label: Info
      - value: WARN
        label: Warning
      - value: ERROR
        label: Error
