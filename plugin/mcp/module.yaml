name: mcp
title: MCP
provides_services: [http_routes]
requires: [config, events]

actions:
  toggle_server:
    title: "Toggle MCP Server"
  server_status:
    title: "MCP Server Status"
    icon: stopped

config:
  mcp_enabled:
    type: boolean
    default: false
    widget: checkbox
    label: Enable MCP Server
    # Default checkbox width is 120 and clips this caption.
    width: 168
    helper: Localhost only, no auth. Clients use http://localhost:<port>/mcp (streamable HTTP).
    public: true
  mcp_port:
    type: int
    default: 18765
    min: 1024
    max: 65535
    widget: number
    label: MCP Port
    public: true
    # Same-line with tool_exposure (SettingsDialog add_fields: inline skips y advance).
    inline: true
    x: 110
    width: 70
  tool_exposure_mode:
    type: string
    default: delegate
    widget: select
    label: Tool Exposure
    helper: "How specialized tools are surfaced to MCP clients. delegate=reached via the delegate gateway (today's behavior); direct_flat=all MCP-reachable specialized tools listed directly, excluding sidebar-only flows (best for clients with their own tool-search); direct_discovery=small core list plus find_tools (domain catalog, then per-domain tool schemas; best for any client)."
    public: true
    label_x: 195
    label_width: 85
    x: 285
    width: 145
    options:
      - value: delegate
        label: Delegate (default)
      - value: direct_flat
        label: Direct — list all tools
      - value: direct_discovery
        label: Direct — discovery (find_tools)
  _sep_tunnel:
    widget: separator
    label: Public tunnel
  tunnel_enabled:
    type: boolean
    default: false
    widget: checkbox
    label: Expose via public tunnel
    helper: Requires the selected provider binary on PATH (cloudflared, bore, ngrok, or tailscale). MCP has no auth — anyone with the public URL can call tools. See MCP Server Status for the public /mcp URL when ready.
    public: true
    inline: true
    width: 170
  test_tunnel:
    type: string
    default: ""
    widget: button
    button_text: "Test Tunnel"
    settings_persist: false
    inline_no_label: true
    x: 200
    width: 80
  tunnel_provider:
    type: string
    default: cloudflare
    widget: select
    label: Provider
    helper: Cloudflare quick tunnel (default), Bore, Ngrok, or Tailscale Funnel (must already be logged in).
    public: true
    # Same-line with tunnel_provider_token (SettingsDialog add_fields: inline skips y advance).
    inline: true
    x: 110
    width: 100
    options:
      - value: cloudflare
        label: Cloudflare
      - value: bore
        label: Bore
      - value: ngrok
        label: Ngrok
      - value: tailscale
        label: Tailscale
  tunnel_provider_token:
    type: string
    default: ""
    widget: password
    label: Provider config
    helper: "Ngrok authtoken; Cloudflare tunnel token; Bore server or 'server secret'. Empty = provider default / CLI config. Unused for Tailscale."
    public: true
    # Keep field immediately after label (label ~85 wide); right edge matches Tool Exposure (~430).
    label_x: 215
    label_width: 85
    x: 302
    width: 128
  client_config_snippet:
    type: string
    default: ""
    widget: textarea
    label: "Client config (copy into Claude / Hermes-Agent):"
    label_above: true
    label_x: 8
    label_width: 340
    readonly: true
    settings_persist: false
    inline: true
    x: 8
    width: 340
    height: 36
  copy_config:
    type: string
    default: ""
    widget: button
    button_text: "Copy Config"
    settings_persist: false
    inline_no_label: true
    x: 355
    width: 75
    height: 16
  cors_allow_private_origins:
    type: boolean
    default: true
    internal: true
  cors_allowed_origins:
    type: list
    default: []
    internal: true
