name: vision
title: Vision / OCR
requires: [config]

settings_tab: false

config_dialog:
  id: VisionSettingsDialog
  library: Dialogs
  title: Vision / OCR Settings
  width: 350
  height: 130
  moveable: true
  resizeable: true
  buttons: [run, apply, ok, close]
  preview: {height: 200}

actions:
  open_settings:
    title: Vision OCR Settings...

config:
  images_scale:
    type: float
    default: 1.0
    min: 0.5
    max: 3.0
    widget: number
    page: general
    label: Image scale
    width: 50
    # Shares row 1 with document_timeout.
    inline: true
    helper: Upscale before OCR/layout. Try 2.0 for small screenshots.

  document_timeout:
    type: float
    default: 0
    min: 0
    max: 600
    widget: number
    page: general
    label: Document timeout (s)
    label_x: 188
    label_width: 100
    x: 290
    width: 52
    helper: Stops Docling processing of one document after this many seconds and keeps the pages finished so far. Model download and loading do not count. 0 turns the limit off.

  ocr_backend:
    type: string
    default: rapidocr
    widget: select
    page: general
    label: OCR engine
    helper: OCR engine Docling uses. Every engine except RapidOCR (ONNX) must be installed in the Python venv; Settings → Python → Test lists the installed ones.
    options:
      - {value: rapidocr, label: "RapidOCR (ONNX, default)"}
      - {value: rapidocr_openvino, label: "RapidOCR (OpenVINO)"}
      - {value: rapidocr_paddle, label: "RapidOCR (PaddlePaddle)"}
      - {value: rapidocr_torch, label: "RapidOCR (PyTorch)"}
      - {value: easyocr, label: EasyOCR}
      - {value: tesseract, label: "Tesseract (command line)"}
      - {value: ocrmac, label: "Apple Vision (macOS)"}
      - {value: nemotron, label: "NVIDIA Nemotron OCR (Linux, CUDA)"}
      - {value: auto, label: Docling auto}

  lang:
    type: string
    default: ""
    widget: text
    page: general
    label: OCR language
    width: 50
    inline: true
    helper: Language codes such as en, de or zh-TW, comma separated (Docling engines; the Paddle engine uses only a single PP-OCR code). Empty uses the language of the image or of LibreOffice.

  device:
    type: string
    default: auto
    widget: select
    page: general
    label: Device
    label_x: 188
    label_width: 100
    x: 290
    width: 52
    helper: Hardware for Docling's models. Auto uses a GPU when Docling finds one; CPU always works.
    options:
      - {value: auto, label: Auto}
      - {value: cpu, label: CPU}
      - {value: cuda, label: CUDA}
      - {value: mps, label: MPS}

  text_score:
    type: float
    default: 0.5
    min: 0.0
    max: 1.0
    widget: number
    page: general
    width: 50
    label: OCR confidence threshold
    helper: Minimum confidence for recognized text (RapidOCR and EasyOCR; other engines ignore it). Raise it to drop garbage text; 0.0 keeps all text.

  # Read by client._resolve_vision_timeout_sec; configured in writeragent.json only.
  worker_timeout_sec:
    type: int
    default: 300
    min: 30
    max: 600
    internal: true
    helper: Host time limit for one Vision helper call, including Docling import and first model download.

  artifacts_path:
    type: string
    default: ""
    internal: true
    helper: Optional folder from docling-tools models download (offline use).

  force_full_page_ocr:
    type: boolean
    default: true
    internal: true
    helper: OCR the whole image, not only detected text regions. PDFs ignore this setting.

  table_mode:
    type: string
    default: accurate
    widget: select
    page: tables
    label: Table extraction mode
    options:
      - {value: accurate, label: Accurate (default)}
      - {value: fast, label: Fast}

  do_cell_matching:
    type: boolean
    default: true
    widget: checkbox
    page: tables
    label: Table cell matching
    helper: Align detected table cells with content (extract_structure).

  create_orphan_clusters:
    type: boolean
    default: true
    widget: checkbox
    page: tables
    label: Keep orphan text clusters
    helper: Group unassigned text into clusters for messy layouts.

  insert_mode:
    type: string
    default: html
    widget: select
    page: tables
    label: Document insert mode
    helper: html = Docling HTML import (default). structured = bbox column layout in Writer; native Calc cells for extract_structure tables.
    options:
      - {value: html, label: Standard HTML}
      - {value: structured, label: Structured (layout / cell grid)}

  layout_model:
    type: string
    default: heron
    widget: select
    page: advanced
    label: Layout model
    options:
      - {value: heron, label: Heron (default)}
      - {value: egret_large, label: "Egret large (slower, complex docs)"}

  do_formula_enrichment:
    type: boolean
    default: false
    widget: checkbox
    page: advanced
    label: Extract formulas (LaTeX)
    helper: Opt-in. Downloads extra VLM models on first use; slower.

  do_code_enrichment:
    type: boolean
    default: false
    widget: checkbox
    page: advanced
    label: Code block enrichment
    helper: Specialized OCR for code/terminal screenshots.

  rapidocr_model_size:
    type: string
    default: small
    widget: select
    page: advanced
    label: RapidOCR model size
    width: 52
    # Shares row 4 with rapidocr_detect_orientation.
    inline: true
    helper: RapidOCR model size for PP-OCRv6 languages; other languages ignore it. Tiny is fastest and has no Japanese model; medium is the most accurate.
    options:
      - {value: tiny, label: Tiny}
      - {value: small, label: Small (default)}
      - {value: medium, label: Medium}

  rapidocr_detect_orientation:
    type: boolean
    default: false
    widget: checkbox
    page: advanced
    label: Fix rotated text (RapidOCR)
    x: 188
    width: 150
    helper: Re-read a region at 90, 180 and 270 degrees when fewer than half its lines read confidently. Fixes sideways scans; costs time only on poor reads. Applies to the RapidOCR engines, not Docling auto.

