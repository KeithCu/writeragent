name: vision
title: Vision / OCR
requires: [config]

settings_tab: false

config_dialog:
  id: VisionSettingsDialog
  library: Dialogs
  title: Vision / OCR Settings
  width: 350
  height: 130
  moveable: true
  resizeable: true
  modeless: true
  buttons: [apply, ok, close]

actions:
  open_settings:
    title: Vision OCR Settings...

config:
  images_scale:
    type: float
    default: 1.0
    min: 0.5
    max: 3.0
    widget: number
    page: general
    label: Image scale
    width: 50
    # Shares row 1 with document_timeout.
    inline: true
    helper: Upscale before OCR/layout. Try 2.0 for small screenshots.

  document_timeout:
    type: float
    default: 0
    min: 0
    max: 600
    widget: number
    page: general
    label: Document timeout (s)
    label_x: 188
    label_width: 100
    x: 290
    width: 52
    helper: Stops Docling processing of one document after this many seconds and keeps the pages finished so far. Model download and loading do not count. 0 turns the limit off.

  text_score:
    type: float
    default: 0.5
    min: 0.0
    max: 1.0
    widget: number
    page: general
    width: 50
    label: OCR confidence threshold
    helper: Minimum RapidOCR confidence for recognized text. Raise it to drop garbage text; 0.0 keeps all text.

  # Read by client._resolve_vision_timeout_sec; configured in writeragent.json only.
  worker_timeout_sec:
    type: int
    default: 300
    min: 30
    max: 600
    internal: true
    helper: Host time limit for one Vision helper call, including Docling import and first model download.

  artifacts_path:
    type: string
    default: ""
    internal: true
    helper: Optional folder from docling-tools models download (offline use).

  force_full_page_ocr:
    type: boolean
    default: true
    internal: true
    helper: OCR the whole image, not only detected text regions. PDFs ignore this setting.

  table_mode:
    type: string
    default: accurate
    widget: select
    page: tables
    label: Table extraction mode
    options:
      - {value: accurate, label: Accurate (default)}
      - {value: fast, label: Fast}

  do_cell_matching:
    type: boolean
    default: true
    widget: checkbox
    page: tables
    label: Table cell matching
    helper: Align detected table cells with content (extract_structure).

  create_orphan_clusters:
    type: boolean
    default: true
    widget: checkbox
    page: tables
    label: Keep orphan text clusters
    helper: Group unassigned text into clusters for messy layouts.

  insert_mode:
    type: string
    default: html
    widget: select
    page: tables
    label: Document insert mode
    helper: html = Docling HTML import (default). structured = bbox column layout in Writer; native Calc cells for extract_structure tables.
    options:
      - {value: html, label: Standard HTML}
      - {value: structured, label: Structured (layout / cell grid)}

  layout_model:
    type: string
    default: heron
    widget: select
    page: advanced
    label: Layout model
    options:
      - {value: heron, label: Heron (default)}
      - {value: egret_large, label: "Egret large (slower, complex docs)"}

  do_formula_enrichment:
    type: boolean
    default: false
    widget: checkbox
    page: advanced
    label: Extract formulas (LaTeX)
    helper: Opt-in. Downloads extra VLM models on first use; slower.

  do_code_enrichment:
    type: boolean
    default: false
    widget: checkbox
    page: advanced
    label: Code block enrichment
    helper: Specialized OCR for code/terminal screenshots.

