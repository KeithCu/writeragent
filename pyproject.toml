[project]
name = "WriterAgent"
dynamic = ["version"]
description = "LibreOffice AI writing assistant with MCP server"
requires-python = ">=3.11"
license = {text = "GPL-3.0-or-later"}
dependencies = [
    "polib",
    "pytest-cov>=7.1.0",
    "ty",
    "bowler",
]

[tool.uv]
default-groups = ["dev"]

[tool.setuptools.dynamic]
version = {attr = "plugin.version.EXTENSION_VERSION"}

[tool.setuptools.packages.find]
include = ["plugin*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--ignore=build --ignore=tests/uno --ignore=tests/scripting/test_serialization_verification.py"
markers = [
    "slow: excluded from default pytest; run via make slowtests",
    "integration: full subprocess worker IPC (optional, slower)",
]
filterwarnings = [
    "ignore::DeprecationWarning:matplotlib.*",
    "ignore::DeprecationWarning:pyparsing.*",
    "ignore::pyparsing.PyparsingDeprecationWarning",
    "ignore:Precision loss occurred in moment calculation:RuntimeWarning:scipy.*",
    "ignore::statsmodels.tools.sm_exceptions.ValueWarning",
    "ignore:invalid value encountered in sqrt:RuntimeWarning:sklearn.*",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "latex2mathml",
    "isodate",
    "json-repair",
    "snowballstemmer",
    "websockets>=13.0,<16",
    "pytest",
    "pyyaml",
    "sounddevice",
    "mypy",
    "types-requests",
    "types-unopy",
    "basedpyright>=1.39.0",
    "bandit[toml]>=1.8.0",
    "pyspector>=0.2.1",
    "ruff>=0.9.0",
    "pyrefly>=0.61.0",
    "openpyxl>=3.1.0",
    "odfpy>=1.4.0",
    "python-docx>=1.1.0",
    "xlrd>=2.0.0",
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "spacy",
    "textdescriptives",
    "statsmodels",
    "ydata-profiling",
    "pandas-montecarlo",
    "sympy",
    "pint",
    "matplotlib",
    "deal",
    "crosshair-tool",
    "hypothesis",
    "Cython",
    "setuptools",
    "build",
    "sqlite-vec",
    "css-inline",
    "icu4py",
    "py-spy",
    "Pillow",
]

[tool.ruff]
line-length = 300
extend-exclude = [
    "plugin/contrib",
    "plugin/lib",
    "plugin/tests",
    "plugin/scripting/venv/text_analytics.py",
]

# Collapse multi-line calls when they fit line-length; do not treat a trailing comma as “keep expanded”.
[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "TC"]
# UNO/bootstrap often uses imports after path setup; one-line if/for with colon is legacy style.
extend-ignore = ["E402", "E701"]

[tool.ruff.lint.per-file-ignores]
# tests/ are not in ty/mypy/basedpyright scope; TYPE_CHECKING moves are busywork there.
"tests/**" = ["TC001", "TC002", "TC003"]

[tool.ruff.lint.flake8-type-checking]
quote-annotations = true
# Dataclass field types are evaluated at class creation; keep first-party imports out of TYPE_CHECKING.
runtime-evaluated-decorators = ["dataclasses.dataclass"]

[tool.mypy]
python_version = "3.11"
explicit_package_bases = true
ignore_missing_imports = true
disable_error_code = ["annotation-unchecked"]
packages = ["plugin", "compute_service"]
exclude = [
    "plugin/contrib/",
    "plugin/lib/",
    "plugin/tests/",
    "tests/",
    "plugin/scripting/venv/text_analytics.py",
]

[[tool.mypy.overrides]]
module = "officehelper"
ignore_missing_imports = true

# `exclude` does not skip subpackages when using `packages = ["plugin"]`; mirror ty scope.
[[tool.mypy.overrides]]
module = "plugin.contrib.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "plugin.lib.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "plugin.scripting.venv.text_analytics"
ignore_errors = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "sounddevice"
ignore_missing_imports = true
disable_error_code = ["import-untyped"]

[tool.bandit]
# Same scope as ty/mypy/pyright: extension code only (see Makefile `bandit` target).
exclude_dirs = ["plugin/contrib", "plugin/lib", "plugin/tests", "tests", "plugin/scripting/venv/text_analytics.py"]
# urllib is used intentionally for HTTP (see modules/http); B314 is ET on trusted small update.xml.
skips = ["B310", "B314", "B608"]

[tool.ty.src]
# Optional: explicitly set what to include (defaults to common patterns)
include = ["plugin", "compute_service"]
exclude = ["plugin/contrib", "plugin/lib", "plugin/tests", "plugin/xdl_strings.py", "tests", "plugin/scripting/venv/text_analytics.py"]

[tool.ty.rules]
redundant-cast = "ignore"
# Optional-dependency import guards (e.g. `import language_tool_python  # type: ignore`)
# read as "unused" once that optional package happens to be installed in the dev venv, but
# the ignore is required where the package is absent (LibreOffice's bundled Python). Don't
# fail the type gate based on which optional extras a given checkout has installed.
unused-type-ignore-comment = "ignore"


# Pyrefly (CLI: make pyrefly) — experimental; same scope as ty/mypy/pyright; not part of make test
[tool.pyrefly]
project-includes = ["plugin", "compute_service"]
project-excludes = ["plugin/contrib/**", "plugin/lib/**", "plugin/tests/**", "tests/**", "plugin/scripting/venv/text_analytics.py"]
python-version = "3.11"
# Repo root so `from plugin...` inside `if TYPE_CHECKING:` resolves; Pyrefly treats TYPE_CHECKING as true.
search-path = ["."]
check-unannotated-defs = true
infer-return-types = "checked"
infer-with-first-use = true

# Basedpyright (CLI: make basedpyright) — same scope as ty/mypy; uses .venv for stubs (types-unopy) and UNO via make fix-uno
[tool.basedpyright]
# typeCheckingMode options: "off", "basic", "standard" (default), "strict", "all"
typeCheckingMode = "all"
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
include = ["plugin", "compute_service"]
# quant.py (like text_analytics.py) targets optional heavy deps not in the dev group; when
# those extras are installed for QA, basedpyright type-checks against them and flags issues
# that don't apply to the normal dev scope. Exclude it to keep the gate scope stable.
exclude = ["plugin/contrib", "plugin/lib", "plugin/tests", "tests", "plugin/scripting/venv/text_analytics.py", "plugin/scripting/venv/quant.py"]
reportMissingModuleSource = false
reportMissingImports = "none"

# Disable rules that conflict with dynamic PyUNO / Python idioms
reportAny = false
reportExplicitAny = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownParameterType = false
reportMissingParameterType = false
reportUnknownArgumentType = false
# UNO try/except fallback: NAME = cast(Any, n) after ImportError (see docs/type-checking.md)
reportConstantRedefinition = false
# Tool *Base classes intentionally omit execute; concrete tools implement it
reportImplicitAbstractClass = false
# Public facades re-export helpers (scripting/calc analysis, client packages)
reportPrivateLocalImportUsage = false
# Defensive isinstance/cast/comparison on Any/UNO values; often intentional
reportUnnecessaryIsInstance = false
reportUnnecessaryCast = false
reportUnnecessaryComparison = false
# ImportError / optional-import branches look unreachable under stubs
reportUnreachable = false
# Optional scientific / venv packages without stubs
reportMissingTypeStubs = false
# ClassVar / default factory calls in tool bases (e.g. frozenset(...))
reportCallInDefaultInitializer = false
# Rare mixin patterns (e.g. compute_service TCPServer)
reportUnsafeMultipleInheritance = false
# UNO listeners / mixins / lightweight helpers often skip super().__init__()
reportMissingSuperCall = false

# Disable stylistic / noisy rules
reportUnannotatedClassAttribute = false
reportUnknownLambdaType = false
reportPrivateUsage = false
reportUnusedParameter = false
reportDeprecated = false
reportImplicitOverride = false
reportUnusedCallResult = false
reportImportCycles = false
# Adjacent string literals for long prompts / tool descriptions
reportImplicitStringConcatenation = false
# Cross-checker # type: ignore[...] comments for ty/mypy
reportUnnecessaryTypeIgnoreComment = false
# TODO: consider enabling reportMissingTypeArgument in the future to enforce generic type parameters (dict[str, Any], list[str])
reportMissingTypeArgument = false

[tool.coverage.run]
source = ["plugin/framework"]

[tool.coverage.report]
show_missing = true
