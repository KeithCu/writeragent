<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}WriterAgent{% endblock %} — AI in LibreOffice</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/site.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='images/favicon-32.png') }}" type="image/png" sizes="32x32">
    <link rel="icon" href="{{ url_for('static', filename='images/favicon-48.png') }}" type="image/png" sizes="48x48">
    <link rel="icon" href="{{ url_for('static', filename='images/writeragent_logo.svg') }}" type="image/svg+xml">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='images/apple-touch-icon.png') }}">
    {% block head %}{% endblock %}
</head>

<body>
    <header class="site-header">
        <div class="wrap">
            <a href="{{ url_for('index') }}" class="logo">
                <img src="{{ url_for('static', filename='images/writeragent_logo.svg') }}" alt="" width="32" height="32"
                    class="logo-img">
                <span class="logo-text">WriterAgent</span>
            </a>
            <nav class="nav">
                <a href="{{ url_for('index') }}">Home</a>
                <a href="{{ url_for('install') }}">Install</a>
                <a href="{{ url_for('local') }}">Local Models</a>
                <a href="https://github.com/balisujohn/writeragent" target="_blank" rel="noopener">GitHub</a>
            </nav>
        </div>
    </header>

    <main class="site-main">
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <div class="wrap">
            <p>
                <a href="https://github.com/balisujohn/writeragent">GitHub</a>
                · <a href="https://ko-fi.com/johnbalis">Support on Ko-fi</a>
                · <a href="{{ url_for('privacy') }}">Privacy</a>
                · <a href="https://github.com/balisujohn/writeragent/blob/main/License.txt">MPL 2.0</a>
            </p>
            <p class="copyright">Copyright &copy; 2024 John Balis</p>
        </div>
    </footer>
</body>

</html>
